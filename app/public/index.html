<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #09090b;
    --muted: #71717a;
    --border: #e4e4e7;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 24px;
    font-family: Poppins, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
  .row { display: flex; gap: 8px; margin-bottom: 24px; }
  input, button {
    font: inherit;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 8px 12px;
  }
  input { flex: 1; outline: none; }
  input:focus { border-color: var(--fg); }
  button { background: var(--fg); color: var(--bg); border-color: var(--fg); cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--border); }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
  }
  li span { flex: 1; font-size: 14px; }
  .danger { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
  .error { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Notas</h1>
  <p class="sub">CRUD simples para o laboratorio</p>

  <div class="row">
    <input id="content" placeholder="Nova nota" autocomplete="off">
    <button onclick="createNote()">Adicionar</button>
  </div>

  <ul id="list"></ul>
  <p id="status" class="error"></p>

  <div class="danger">
    <div class="row">
      <input id="rate" type="number" value="5" min="1">
      <button class="ghost" onclick="startLeak()">Vazar memoria (MB/s)</button>
    </div>
  </div>
</main>

<script>
const status = document.getElementById("status");

async function load() {
  try {
    const res = await fetch("/api/notes");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const notes = await res.json();
    document.getElementById("list").innerHTML = notes
      .map((n) => `<li><span>${n.content}</span>
        <button class="ghost" onclick="editNote(${n.id}, '${n.content}')">Editar</button>
        <button class="ghost" onclick="removeNote(${n.id})">Remover</button></li>`)
      .join("");
    status.textContent = "";
  } catch (error) {
    status.textContent = `Falha ao carregar notas: ${error.message}`;
  }
}

async function createNote() {
  const input = document.getElementById("content");
  if (!input.value) return;
  await fetch("/api/notes", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: input.value }),
  });
  input.value = "";
  load();
}

async function editNote(id, current) {
  const content = prompt("Editar nota", current);
  if (content === null) return;
  await fetch(`/api/notes/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content }),
  });
  load();
}

async function removeNote(id) {
  await fetch(`/api/notes/${id}`, { method: "DELETE" });
  load();
}

async function startLeak() {
  const rate = Number(document.getElementById("rate").value);
  await fetch("/api/leak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ rate_mb_s: rate }),
  });
  status.textContent = `Vazamento iniciado em ${rate} MB/s`;
}

load();
</script>
</body>
</html>
